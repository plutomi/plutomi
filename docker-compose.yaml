version: "3.8"

services:
  mysql:
    image: mysql:8.0.39
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: plutomi
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/data/mysql

  nats:
    image: nats:2.9.21-alpine
    container_name: nats
    # Enable JetStream and store data under /data (which we mount below).
    command: ["-js", "--store_dir=/data"]
    ports:
      - "4222:4222" # NATS client connections
      - "8222:8222" # HTTP monitoring
    volumes:
      - nats_data:/data

volumes:
  mysql_data:
    driver: local
  nats_data:
    driver: local
